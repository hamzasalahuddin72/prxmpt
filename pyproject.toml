[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearcue-coach"
version = "1.0.5"
description = "A consent-based Windows interview practice and meeting coaching assistant."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Hamza Salahuddin" }]
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=2.0,<3",
  "SoundCard>=0.4.6,<0.5",
  "faster-whisper>=1.2,<2",
  "webrtcvad-wheels>=2.0.14,<3",
  "openai>=2.0,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "keyring>=25,<27",
  "pynput>=1.7,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pyinstaller>=6.14,<7",
]

[project.scripts]
clearcue = "clearcue.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
