name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build and test
        shell: powershell
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: prxmpt-Windows-Update-1.0.22
          path: installer/output/prxmptUpdate_1.0.22.exe
          if-no-files-found: error
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "installer/output/prxmptUpdate_1.0.22.exe"
          --verify-tag
          --generate-notes
          --title "prxmpt ${{ github.ref_name }}"
